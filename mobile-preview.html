<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estudio de Desarrollo Móvil en Vivo - La Pura Neta Radio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #18181b 0%, #09090b 100%);
    }
    .device-shadow {
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 10px #27272a, 0 0 0 12px #3f3f46;
    }
  </style>
</head>
<body class="text-zinc-100 min-h-screen flex flex-col items-center p-4">

  <!-- TOP TOOLBAR -->
  <header class="w-full max-w-4xl bg-zinc-900/90 border border-zinc-800 backdrop-blur-md rounded-2xl p-3 mb-4 flex flex-wrap items-center justify-between gap-3 shadow-2xl">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-red-600 animate-pulse"></div>
      <div>
        <h1 class="text-sm font-bold text-white tracking-wide">LA PURA NETA RADIO • LIVE DEV STUDIO</h1>
        <p class="text-[11px] text-zinc-400">Edición en tiempo real (Cualquier cambio en el código se actualiza aquí al instante)</p>
      </div>
    </div>

    <!-- CONTROLS -->
    <div class="flex items-center gap-2">
      <!-- Device Selector -->
      <div class="flex bg-black/60 p-1 rounded-xl border border-zinc-800 text-xs font-semibold">
        <button id="btn-iphone" onclick="changeDevice('iphone')" class="px-3 py-1.5 rounded-lg bg-red-600 text-white shadow">
          iPhone 15 Pro
        </button>
        <button id="btn-android" onclick="changeDevice('android')" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors">
          Galaxy S24
        </button>
        <button id="btn-tablet" onclick="changeDevice('tablet')" class="px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors">
          Tablet
        </button>
      </div>

      <!-- Reload button -->
      <button onclick="reloadFrame()" title="Recargar App" class="p-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-white transition-all active:scale-90 border border-zinc-700">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
      </button>

      <a href="index.html" target="_blank" class="text-xs px-3 py-1.5 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-medium border border-zinc-700 transition-colors">
        Abrir Web Completa ↗
      </a>
    </div>
  </header>

  <!-- DEVICE FRAME CONTAINER -->
  <main class="flex-1 flex items-center justify-center p-2 w-full">
    <div id="device-wrapper" class="device-shadow relative w-[380px] h-[800px] bg-black rounded-[50px] overflow-hidden flex flex-col border border-zinc-700 transition-all duration-300">
      
      <!-- REALISTIC NATIVE STATUS BAR -->
      <div id="status-bar" class="w-full h-11 bg-black text-white px-6 flex items-center justify-between text-[11px] font-semibold select-none z-50 flex-shrink-0">
        <!-- Clock -->
        <span id="live-clock" class="tracking-tight text-white/90">9:41</span>
        
        <!-- Dynamic Island (Centered) -->
        <div id="notch" class="w-28 h-6 bg-black rounded-full flex items-center justify-between px-2.5 shadow-md border border-zinc-900">
          <div class="w-2.5 h-2.5 rounded-full bg-zinc-900 border border-zinc-800"></div>
          <div class="flex items-center gap-1">
            <span class="w-1 h-2 bg-red-600 rounded-full animate-pulse"></span>
            <span class="w-1 h-3 bg-red-600 rounded-full animate-pulse"></span>
          </div>
          <div class="w-2 h-2 rounded-full bg-blue-950/60"></div>
        </div>

        <!-- Icons (Wifi, Battery) -->
        <div class="flex items-center gap-1.5 text-white/90">
          <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.32c3.78 0 7.21 1.44 9.77 3.82L12 19.1 2.23 11.14C4.79 8.76 8.22 7.32 12 7.32z"/></svg>
          <div class="w-5 h-2.5 border border-white/80 rounded-sm p-0.5 flex items-center">
            <div class="h-full w-4/5 bg-white rounded-2xs"></div>
          </div>
        </div>
      </div>

      <!-- IFRAME WITH LIVE APP -->
      <iframe id="app-iframe" src="index.html" class="w-full flex-1 border-0 bg-black" allow="autoplay; clipboard-write"></iframe>

      <!-- HOME INDICATOR GESTURE BAR -->
      <div id="gesture-bar" class="w-full h-5 bg-black flex items-center justify-center flex-shrink-0">
        <div class="w-32 h-1 bg-white/30 rounded-full"></div>
      </div>

    </div>
  </main>

  <script>
    function updateClock() {
      const d = new Date();
      const h = d.getHours();
      const m = String(d.getMinutes()).padStart(2, '0');
      document.getElementById('live-clock').textContent = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function reloadFrame() {
      const frame = document.getElementById('app-iframe');
      frame.src = frame.src;
    }

    function changeDevice(type) {
      const wrapper = document.getElementById('device-wrapper');
      const notch = document.getElementById('notch');
      const statusBar = document.getElementById('status-bar');
      const gestureBar = document.getElementById('gesture-bar');
      const btnIphone = document.getElementById('btn-iphone');
      const btnAndroid = document.getElementById('btn-android');
      const btnTablet = document.getElementById('btn-tablet');

      [btnIphone, btnAndroid, btnTablet].forEach(b => {
        b.className = 'px-3 py-1.5 rounded-lg text-zinc-400 hover:text-white transition-colors';
      });

      if (type === 'iphone') {
        wrapper.style.width = '380px';
        wrapper.style.height = '800px';
        wrapper.className = 'device-shadow relative bg-black rounded-[50px] overflow-hidden flex flex-col border border-zinc-700 transition-all duration-300';
        notch.style.display = 'flex';
        statusBar.style.display = 'flex';
        gestureBar.style.display = 'flex';
        btnIphone.className = 'px-3 py-1.5 rounded-lg bg-red-600 text-white shadow';
      } else if (type === 'android') {
        wrapper.style.width = '380px';
        wrapper.style.height = '800px';
        wrapper.className = 'device-shadow relative bg-black rounded-[30px] overflow-hidden flex flex-col border border-zinc-700 transition-all duration-300';
        notch.style.display = 'none';
        statusBar.style.display = 'flex';
        gestureBar.style.display = 'flex';
        btnAndroid.className = 'px-3 py-1.5 rounded-lg bg-red-600 text-white shadow';
      } else if (type === 'tablet') {
        wrapper.style.width = '700px';
        wrapper.style.height = '840px';
        wrapper.className = 'device-shadow relative bg-black rounded-[24px] overflow-hidden flex flex-col border border-zinc-700 transition-all duration-300';
        notch.style.display = 'none';
        statusBar.style.display = 'none';
        gestureBar.style.display = 'none';
        btnTablet.className = 'px-3 py-1.5 rounded-lg bg-red-600 text-white shadow';
      }
    }
  </script>
</body>
</html>
