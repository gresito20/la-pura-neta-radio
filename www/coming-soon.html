  <!-- ================= THEME TOGGLE LOGIC ================= -->
  <script>
    const themeToggleBtn = document.getElementById('theme-toggle-btn');

    function updateLogoSources(isDark) {
      const logos = document.querySelectorAll('.site-logo');
      const logoSrc = isDark ? 'assets/images/logo.png' : 'assets/images/logo_light.png';
      logos.forEach(logo => {
        logo.src = logoSrc;
      });
    }

    // Initialize logo according to active theme
    updateLogoSources(document.documentElement.classList.contains('dark'));

    if (themeToggleBtn) {
      themeToggleBtn.addEventListener('click', () => {
        const willBeDark = !document.documentElement.classList.contains('dark');
        if (willBeDark) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
        updateLogoSources(willBeDark);
      });
    }

    // ================= COMING SOON SLIDER LOGIC (SMOOTH & RANDOM) =================
    const csSlides = document.querySelectorAll('.cs-slide');
    const csDots = document.querySelectorAll('.cs-dot');
    let csCurrent = 0;

    function showCsSlide(idx) {
      if (!csSlides.length) return;
      csCurrent = (idx + csSlides.length) % csSlides.length;
      csSlides.forEach((slide, i) => {
        if (i === csCurrent) {
          slide.classList.remove('opacity-0', 'z-0');
          slide.classList.add('opacity-100', 'z-10');
        } else {
          slide.classList.remove('opacity-100', 'z-10');
          slide.classList.add('opacity-0', 'z-0');
        }
      });
      csDots.forEach((dot, i) => {
        if (i === csCurrent) {
          dot.className = 'cs-dot w-5 h-1.5 rounded-full bg-red-600 transition-all cursor-pointer';
        } else {
          dot.className = 'cs-dot w-2 h-1.5 rounded-full bg-white/50 hover:bg-white transition-all cursor-pointer';
        }
      });
    }

    function randomNextCsSlide() {
      if (csSlides.length <= 1) return;
      let nextIdx;
      do {
        nextIdx = Math.floor(Math.random() * csSlides.length);
      } while (nextIdx === csCurrent);
      showCsSlide(nextIdx);
    }

    csDots.forEach((dot, i) => {
      dot.addEventListener('click', () => showCsSlide(i));
    });

    setInterval(randomNextCsSlide, 4500);
  </script>
